<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Roll Call — decide el plan de hoy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#14112B;
    --surface:#1F1B47;
    --surface-2:#2A2560;
    --line: rgba(244,242,255,0.10);
    --text:#F4F2FF;
    --muted:#A9A3D6;
    --coral:#FF5A5F;
    --gold:#FFC24B;
    --teal:#2FE0C4;
    --violet:#9B7BFF;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(155,123,255,0.20), transparent 60%),
      radial-gradient(1000px 600px at 110% 10%, rgba(47,224,196,0.14), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100%;
    display:flex;
    flex-direction:column;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk','Inter',system-ui,sans-serif;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
  }
  #app{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:24px 16px 40px;
    width:100%;
  }
  .wrap{width:100%;max-width:560px;}
  .wrap.wide{max-width:820px;}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:24px;
  }
  .stack{display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:12px;}
  .center{text-align:center;}
  p.lead{color:var(--muted);font-size:15px;line-height:1.55;margin:8px 0 0;}
  label{font-size:13px;color:var(--muted);font-weight:600;}
  input[type=text], input[type=number], textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:12px;
    padding:14px 16px;
    font-size:16px;
    font-family:inherit;
    outline:none;
  }
  input:focus, textarea:focus{border-color:var(--violet);}
  input.code-input{
    text-transform:uppercase;
    letter-spacing:0.35em;
    text-align:center;
    font-family:'Space Grotesk',monospace;
    font-size:22px;
    font-weight:700;
  }
  textarea{min-height:150px;font-size:15px;line-height:1.5;resize:vertical;}
  button{
    font-family:'Space Grotesk','Inter',sans-serif;
    font-weight:700;
    font-size:16px;
    border:none;
    border-radius:12px;
    padding:14px 20px;
    cursor:pointer;
    color:#171335;
    background:var(--teal);
    transition:transform .12s ease, filter .12s ease;
  }
  button:hover{filter:brightness(1.06);}
  button:active{transform:scale(0.98);}
  button.secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--line);
  }
  button.ghost{
    background:transparent;
    color:var(--muted);
    border:none;
    padding:8px;
    font-size:14px;
  }
  button:disabled{opacity:0.45;cursor:not-allowed;}
  button.block{width:100%;}
  .code-display{
    font-family:'Space Grotesk',monospace;
    font-size:52px;
    font-weight:700;
    letter-spacing:0.14em;
    text-align:center;
    color:var(--gold);
    margin:6px 0;
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
    font-size:13px;
    color:var(--muted);
  }
  .pill.strong{color:var(--text);}
  .pill.accent{background:rgba(47,224,196,0.15);color:var(--teal);border-color:rgba(47,224,196,0.3);}
  .player-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .chip{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 14px;
    font-size:14px;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .chip.done{background:rgba(47,224,196,0.15);color:var(--teal);border-color:rgba(47,224,196,0.3);}
  .top-flex{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}

  /* Plan grid */
  .plans-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media (max-width:480px){ .code-display{font-size:42px;} }
  .plan-card{
    background:var(--surface-2);
    border:2px solid transparent;
    border-radius:16px;
    padding:14px 12px;
    text-align:center;
    color:var(--text);
    font-size:16px;
    font-weight:600;
    font-family:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    min-height:120px;
    cursor:pointer;
    transition:transform .15s ease, opacity .3s ease;
  }
  .plan-card .plan-emoji{font-size:32px;line-height:1;}
  .plan-card .plan-name{font-size:14px;line-height:1.25;margin-top:6px;}
  .plan-card .plan-meta{
    font-size:11px;
    color:var(--muted);
    margin-top:8px;
    font-weight:500;
  }
  .plan-card.vetoed{
    background:transparent;
    border:1px dashed rgba(244,242,255,0.15);
    color:var(--muted);
    cursor:default;
  }
  .plan-card.vetoed .plan-name{
    text-decoration:line-through;
    text-decoration-thickness:2px;
    text-decoration-color:var(--coral);
  }
  .plan-card.mine-vetoed{
    background:rgba(255,90,95,0.12);
    border:2px solid rgba(255,90,95,0.35);
    cursor:pointer;
    color:var(--text);
  }
  .plan-card.mine-vetoed .plan-name{
    text-decoration:line-through;
    text-decoration-thickness:2px;
    text-decoration-color:var(--coral);
  }
  .plan-card.mine-vetoed .plan-meta{color:var(--coral);font-weight:700;}
  .plan-card.disabled{cursor:default;opacity:0.6;}
  .plan-card:not(.vetoed):not(.disabled):hover{transform:translateY(-2px);border-color:var(--violet);}

  /* Voting */
  .vote-option{
    background:var(--surface-2);
    border:2px solid transparent;
    border-radius:14px;
    padding:16px 18px;
    color:var(--text);
    font-size:16px;
    font-weight:600;
    font-family:inherit;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    cursor:pointer;
    width:100%;
    text-align:left;
  }
  .vote-option .tally{
    font-family:'Space Grotesk',monospace;
    font-weight:700;
    color:var(--gold);
    font-size:18px;
  }
  .vote-option.mine{
    border-color:var(--teal);
    background:rgba(47,224,196,0.12);
  }
  .vote-option:hover{border-color:var(--violet);}

  .winner-card{
    background:linear-gradient(140deg, rgba(255,194,75,0.25), rgba(47,224,196,0.15));
    border:1px solid rgba(255,194,75,0.4);
    border-radius:20px;
    padding:32px 24px;
    text-align:center;
  }
  .winner-name{
    font-family:'Space Grotesk',sans-serif;
    font-size:36px;
    font-weight:700;
    color:var(--gold);
    line-height:1.1;
    margin-top:4px;
  }

  .banner{
    border-radius:14px;
    padding:14px 16px;
    font-weight:600;
    font-size:15px;
  }
  .banner.info{background:var(--surface-2);color:var(--muted);}
  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding:12px;
    opacity:0.6;
  }
  a.linklike{color:var(--teal);text-decoration:none;font-weight:600;}
  .error-msg{color:var(--coral);font-size:14px;font-weight:600;}
  .divider{height:1px;background:var(--line);margin:6px 0;}
  .num-input{max-width:100px;text-align:center;}
</style>
</head>
<body>
<div id="app"></div>
<footer>Roll Call · pool de planes, veto en vivo, voto final</footer>

<script>
/* ---------- Plan catalog (fixed, same for every room) ---------- */
const CATALOG = [
  {id:'canas',       emoji:'🍺', name:'Cañas'},
  {id:'restaurante', emoji:'🍽️', name:'Cena en un restaurante'},
  {id:'tapas',       emoji:'🥘', name:'Ir de tapas'},
  {id:'domicilio',   emoji:'🍕', name:'Pedir a domicilio'},
  {id:'cocinar',     emoji:'👨‍🍳', name:'Cocinar algo juntos'},
  {id:'cafe',        emoji:'☕', name:'Café o merienda'},
  {id:'brunch',      emoji:'🥞', name:'Brunch'},
  {id:'cine',        emoji:'🎬', name:'Cine'},
  {id:'concierto',   emoji:'🎸', name:'Concierto'},
  {id:'museo',       emoji:'🖼️', name:'Museo o exposición'},
  {id:'teatro',      emoji:'🎭', name:'Teatro'},
  {id:'mercadillo',  emoji:'🎡', name:'Feria o mercadillo'},
  {id:'bolera',      emoji:'🎳', name:'Bolera'},
  {id:'karaoke',     emoji:'🎤', name:'Karaoke'},
  {id:'escape',      emoji:'🗝️', name:'Escape room'},
  {id:'karts',       emoji:'🏎️', name:'Karts'},
  {id:'padel',       emoji:'🎾', name:'Pádel o similar'},
  {id:'ruta',        emoji:'🥾', name:'Ruta o senderismo'},
  {id:'paseo',       emoji:'🚶', name:'Paseo largo por la ciudad'},
  {id:'peli_casa',   emoji:'🍿', name:'Peli en casa'},
  {id:'serie',       emoji:'📺', name:'Maratón de serie'},
  {id:'juegos_mesa', emoji:'🎲', name:'Juegos de mesa'},
  {id:'videojuegos', emoji:'🎮', name:'Sesión de videojuegos'},
  {id:'fiesta',      emoji:'🕺', name:'Salir de fiesta'},
  {id:'spa',         emoji:'♨️', name:'Balneario o spa'},
  {id:'terraza',     emoji:'🌇', name:'Terraza a ver el atardecer'}
];

/* ---------- State ---------- */
let db = null;
let roomCode = null;
let playerId = null;
let roomRef = null;
let unsub = [];
const app = document.getElementById('app');

/* ---------- Firebase config bootstrap ---------- */
function getSavedConfig(){
  try { return JSON.parse(localStorage.getItem('sr_firebase_config')||'null'); }
  catch(e){ return null; }
}
function saveConfig(cfg){ localStorage.setItem('sr_firebase_config', JSON.stringify(cfg)); }
function initFirebase(cfg){
  if(firebase.apps.length===0) firebase.initializeApp(cfg);
  db = firebase.database();
}
function boot(){
  const cfg = getSavedConfig();
  if(!cfg){ renderSetup(); return; }
  try{ initFirebase(cfg); renderHome(); }
  catch(e){ renderSetup("No se pudo conectar con esa configuración."); }
}

/* ---------- Helpers ---------- */
function clearApp(){
  unsub.forEach(fn=>{ try{fn();}catch(e){} });
  unsub = [];
  app.innerHTML = '';
}
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function genId(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,10); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function savePlayerId(code, id){ sessionStorage.setItem('rc_pid_'+code, id); }
function getSavedPlayerId(code){ return sessionStorage.getItem('rc_pid_'+code); }

/* ---------- Screen: Firebase setup ---------- */
function renderSetup(errorMsg){
  clearApp();
  app.appendChild(el(`
    <div class="wrap" style="margin-top:20px;">
      <div class="card stack">
        <h1>📣 Configura tu base de datos</h1>
        <p class="lead">Esta app usa un proyecto Firebase gratuito propio para sincronizar las salas entre dispositivos. Solo se hace una vez por navegador.</p>
        ${errorMsg ? `<div class="error-msg">${escapeHtml(errorMsg)}</div>` : ''}
        <label>Pega aquí tu firebaseConfig (JSON con comillas dobles)</label>
        <textarea id="cfgInput" placeholder='{"apiKey":"...","databaseURL":"...", ...}'></textarea>
        <button class="block" id="saveCfgBtn">Guardar y continuar</button>
      </div>
    </div>
  `));
  document.getElementById('saveCfgBtn').onclick = ()=>{
    const raw = document.getElementById('cfgInput').value.trim();
    let cfg;
    try{ cfg = JSON.parse(raw); }
    catch(e){ renderSetup("Eso no es JSON válido. Usa comillas dobles en las claves."); return; }
    if(!cfg.databaseURL){ renderSetup("Falta 'databaseURL'. Asegúrate de activar Realtime Database antes de copiar la config."); return; }
    saveConfig(cfg);
    try{ initFirebase(cfg); renderHome(); }
    catch(e){ renderSetup("No se pudo inicializar Firebase con esos datos."); }
  };
}

/* ---------- Screen: Home ---------- */
function renderHome(){
  clearApp();
  app.appendChild(el(`
    <div class="wrap" style="margin-top:40px;">
      <div class="stack center" style="margin-bottom:22px;">
        <h1 style="font-size:44px;">📣 Roll Call</h1>
        <p class="lead">Pool de planes, veto en vivo, voto final. Decidid en 2 minutos qué hacéis hoy.</p>
      </div>
      <div class="stack">
        <button class="block" id="hostBtn">Crear plan de quedada</button>
        <button class="block secondary" id="joinBtn">Unirme con un código</button>
      </div>
      <div class="center" style="margin-top:22px;">
        <button class="ghost" id="resetCfgBtn">Cambiar configuración de Firebase</button>
      </div>
    </div>
  `));
  document.getElementById('hostBtn').onclick = renderHostSetup;
  document.getElementById('joinBtn').onclick = ()=>renderJoin();
  document.getElementById('resetCfgBtn').onclick = ()=>{
    localStorage.removeItem('sr_firebase_config');
    renderSetup();
  };
}

/* ---------- Screen: Host setup (name + vetoes only) ---------- */
function renderHostSetup(prefillErr){
  clearApp();
  app.appendChild(el(`
    <div class="wrap">
      <div class="card stack">
        <h2>Nueva quedada</h2>
        <p class="lead">La lista de planes es fija — todos veréis los mismos ${CATALOG.length} candidatos. Solo elige cuántos puede tachar cada persona.</p>

        <label>Tu nombre</label>
        <input type="text" id="hostName" maxlength="20" placeholder="Escribe tu nombre">

        <label>Vetos por persona</label>
        <input type="number" id="vetoesInput" class="num-input" min="1" max="10" value="2">

        ${prefillErr ? `<div class="error-msg">${escapeHtml(prefillErr)}</div>` : ''}

        <div class="row">
          <button class="secondary" id="backBtn">Volver</button>
          <button class="block" id="createBtn">Crear sala</button>
        </div>
      </div>
    </div>
  `));
  document.getElementById('backBtn').onclick = renderHome;
  document.getElementById('createBtn').onclick = ()=>{
    const name = document.getElementById('hostName').value.trim();
    const vetoes = parseInt(document.getElementById('vetoesInput').value, 10);
    if(!name){ renderHostSetup("Escribe tu nombre."); return; }
    if(!Number.isFinite(vetoes) || vetoes < 1 || vetoes > 10){ renderHostSetup("Los vetos deben ir entre 1 y 10."); return; }
    if(vetoes >= CATALOG.length){ renderHostSetup("Los vetos por persona deben ser menos que el número de planes."); return; }
    createRoom({name, vetoes});
  };
}

function createRoom({name, vetoes}){
  roomCode = genCode();
  playerId = genId('p');
  savePlayerId(roomCode, playerId);
  roomRef = db.ref('rooms/'+roomCode);

  const plansObj = {};
  CATALOG.forEach(p=>{
    plansObj[p.id] = {name:p.name, emoji:p.emoji, vetoedBy:null};
  });

  roomRef.set({
    createdAt: firebase.database.ServerValue.TIMESTAMP,
    status: 'lobby',
    vetoesPerPlayer: vetoes,
    plans: plansObj,
    players: {
      [playerId]: {name, isHost:true, vetoesLeft: vetoes}
    },
    votes: {},
    winner: null
  }).then(()=>{
    enterRoom();
  }).catch(()=>{
    renderHostSetup("No se pudo crear la sala. Revisa las reglas de tu Realtime Database.");
  });
}

/* ---------- Screen: Join ---------- */
function renderJoin(prefillErr){
  clearApp();
  app.appendChild(el(`
    <div class="wrap">
      <div class="card stack">
        <h2>Unirme a una quedada</h2>
        <label>Código de sala</label>
        <input type="text" id="codeInput" class="code-input" maxlength="5" placeholder="ABCDE">
        <label>Tu nombre</label>
        <input type="text" id="nameInput" maxlength="20" placeholder="Escribe tu nombre">
        ${prefillErr ? `<div class="error-msg">${escapeHtml(prefillErr)}</div>` : ''}
        <div class="row">
          <button class="secondary" id="backBtn">Volver</button>
          <button class="block" id="joinBtn">Entrar</button>
        </div>
      </div>
    </div>
  `));
  document.getElementById('backBtn').onclick = renderHome;
  document.getElementById('joinBtn').onclick = doJoin;
  document.getElementById('nameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doJoin(); });
}

function doJoin(){
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const name = document.getElementById('nameInput').value.trim();
  if(!code || code.length<4){ renderJoin("Escribe el código de sala."); return; }
  if(!name){ renderJoin("Escribe tu nombre."); return; }
  const ref = db.ref('rooms/'+code);
  ref.once('value').then(snap=>{
    if(!snap.exists()){ renderJoin("No existe ninguna sala con ese código."); return; }
    const room = snap.val();
    if(room.status !== 'lobby'){ renderJoin("Esa quedada ya ha empezado, no puedes unirte ahora."); return; }
    roomCode = code; roomRef = ref;
    playerId = getSavedPlayerId(code) || genId('p');
    savePlayerId(code, playerId);
    roomRef.child('players/'+playerId).set({
      name,
      isHost:false,
      vetoesLeft: room.vetoesPerPlayer
    }).then(enterRoom);
  });
}

/* ---------- Room controller (single subscription, routes by status) ---------- */
function enterRoom(){
  clearApp();
  let lastStatus = null;
  const cb = roomRef.on('value', snap=>{
    const room = snap.val();
    if(!room){ renderHome(); return; }
    // Reroute on status change; re-render current phase on any change
    if(room.status !== lastStatus){
      lastStatus = room.status;
    }
    if(room.status==='lobby') renderLobby(room);
    else if(room.status==='vetoing') renderVetoing(room);
    else if(room.status==='voting') renderVoting(room);
    else if(room.status==='ended') renderEnded(room);
  });
  unsub.push(()=>roomRef.off('value', cb));
}

/* ---------- Lobby ---------- */
function renderLobby(room){
  const isHost = room.players[playerId] && room.players[playerId].isHost;
  const players = room.players || {};
  const names = Object.values(players);
  const plansCount = Object.keys(room.plans || {}).length;

  app.innerHTML='';
  app.appendChild(el(`
    <div class="wrap">
      <div class="card stack center">
        <p class="pill">Código de sala</p>
        <div class="code-display">${roomCode}</div>
        <p class="lead">Comparte este código para que se unan.</p>
        <div class="divider"></div>
        <p class="pill strong">${plansCount} planes · ${room.vetoesPerPlayer} vetos por persona</p>
        <p class="pill accent">${names.length} en la sala</p>
        <div class="player-list center" style="justify-content:center;">
          ${names.map(p=>`<span class="chip">${escapeHtml(p.name)}${p.isHost?' 👑':''}</span>`).join('')}
        </div>
        ${isHost ? `
          <button class="block" id="startBtn" ${names.length<2?'disabled':''}>${names.length<2?'Esperando a que alguien más entre…':'Empezar a vetar'}</button>
          <button class="ghost" id="cancelBtn">Cancelar quedada</button>
        ` : `
          <p class="lead">Esperando a que el anfitrión empiece…</p>
          <button class="ghost" id="leaveBtn">Salir</button>
        `}
      </div>
    </div>
  `));
  if(isHost){
    document.getElementById('startBtn').onclick = ()=> roomRef.update({status:'vetoing'});
    document.getElementById('cancelBtn').onclick = ()=>{ roomRef.remove(); renderHome(); };
  } else {
    document.getElementById('leaveBtn').onclick = ()=>{
      roomRef.child('players/'+playerId).remove().then(renderHome);
    };
  }
}

/* ---------- Vetoing ---------- */
function renderVetoing(room){
  const me = room.players[playerId];
  if(!me){ renderHome(); return; }
  const players = room.players || {};
  const plans = room.plans || {};
  const planEntries = Object.entries(plans);
  const remaining = planEntries.filter(([id,p])=>!p.vetoedBy).length;

  const playerVals = Object.values(players);
  const doneCount = playerVals.filter(p=>p.vetoesLeft===0).length;
  const totalPlayers = playerVals.length;
  const everyoneDone = doneCount === totalPlayers;

  app.innerHTML='';
  app.appendChild(el(`
    <div class="wrap wide">
      <div class="stack">
        <div class="top-flex">
          <span class="pill strong">Fase de veto</span>
          <span class="pill accent">Te quedan ${me.vetoesLeft} veto${me.vetoesLeft===1?'':'s'}</span>
        </div>
        <div class="top-flex">
          <span class="pill">${remaining} planes en pie</span>
          <span class="pill">${doneCount}/${totalPlayers} han terminado</span>
        </div>

        <div class="plans-grid" id="plansGrid">
          ${planEntries.map(([id,p])=>{
            const vetoedByMe = p.vetoedBy === playerId;
            const vetoedByOther = p.vetoedBy && !vetoedByMe;
            const vetoerName = p.vetoedBy && players[p.vetoedBy] ? players[p.vetoedBy].name : '';
            let cls = 'plan-card';
            let meta = '';
            let clickable = false;
            if(vetoedByMe){
              cls += ' mine-vetoed';
              meta = 'Tú lo has vetado · toca para deshacer';
              clickable = true;
            } else if(vetoedByOther){
              cls += ' vetoed';
              meta = escapeHtml(vetoerName)+' lo ha vetado';
            } else if(me.vetoesLeft <= 0){
              cls += ' disabled';
              meta = 'Sin vetos disponibles';
            } else {
              meta = 'Toca para vetar';
              clickable = true;
            }
            return `
              <div class="${cls}" data-id="${id}" data-clickable="${clickable}">
                <div class="plan-emoji">${p.emoji||''}</div>
                <div class="plan-name">${escapeHtml(p.name)}</div>
                <div class="plan-meta">${meta}</div>
              </div>`;
          }).join('')}
        </div>

        <div class="banner info">${everyoneDone ? 'Todos habéis usado vuestros vetos. ¡Adelante!' : 'Cuando queráis, cualquiera puede pasar a la votación.'}</div>
        <button class="block" id="toVoteBtn" ${remaining<2?'disabled':''}>${remaining<2?'Necesitas al menos 2 planes en pie':'Ir a la votación'}</button>
      </div>
    </div>
  `));

  document.querySelectorAll('.plan-card').forEach(card=>{
    if(card.dataset.clickable !== 'true') return;
    card.onclick = ()=>{
      const planId = card.dataset.id;
      toggleVeto(planId);
    };
  });

  document.getElementById('toVoteBtn').onclick = ()=>{
    roomRef.update({status:'voting', votes:{}});
  };
}

function toggleVeto(planId){
  roomRef.transaction(room=>{
    if(!room || room.status !== 'vetoing') return room;
    const plan = room.plans && room.plans[planId];
    const player = room.players && room.players[playerId];
    if(!plan || !player) return room;

    if(plan.vetoedBy === playerId){
      // undo my veto
      plan.vetoedBy = null;
      player.vetoesLeft = (player.vetoesLeft||0) + 1;
    } else if(!plan.vetoedBy){
      // new veto
      if((player.vetoesLeft||0) <= 0) return; // abort
      plan.vetoedBy = playerId;
      player.vetoesLeft = player.vetoesLeft - 1;
    }
    return room;
  });
}

/* ---------- Voting ---------- */
function renderVoting(room){
  const me = room.players[playerId];
  if(!me){ renderHome(); return; }
  const plans = room.plans || {};
  const players = room.players || {};
  const votes = room.votes || {};
  const survivors = Object.entries(plans).filter(([id,p])=>!p.vetoedBy);
  const myVote = votes[playerId];
  const totalPlayers = Object.keys(players).length;
  const votedCount = Object.keys(votes).length;
  const everyoneVoted = votedCount === totalPlayers;

  const tally = {};
  survivors.forEach(([id])=>tally[id]=0);
  Object.values(votes).forEach(planId=>{ if(tally[planId]!==undefined) tally[planId]++; });

  app.innerHTML='';
  app.appendChild(el(`
    <div class="wrap">
      <div class="stack">
        <div class="top-flex">
          <span class="pill strong">Fase de voto</span>
          <span class="pill">${votedCount}/${totalPlayers} han votado</span>
        </div>
        <p class="lead">Elige tu favorito entre los que sobrevivieron. Puedes cambiar el voto hasta que se cierre.</p>

        <div class="stack" style="gap:8px;">
          ${survivors.map(([id,p])=>{
            const mine = myVote === id;
            const count = tally[id] || 0;
            return `
              <button class="vote-option ${mine?'mine':''}" data-id="${id}">
                <span>${p.emoji||''} ${escapeHtml(p.name)}${mine?' · tu voto':''}</span>
                <span class="tally">${count}</span>
              </button>`;
          }).join('')}
        </div>

        <div class="banner info">${everyoneVoted ? '¡Todos han votado! Podéis cerrar.' : 'Cualquiera puede cerrar la votación cuando esté claro.'}</div>
        <button class="block" id="closeBtn">Cerrar votación y ver ganador</button>
      </div>
    </div>
  `));

  document.querySelectorAll('.vote-option').forEach(btn=>{
    btn.onclick = ()=>{
      const planId = btn.dataset.id;
      roomRef.child('votes/'+playerId).set(planId);
    };
  });

  document.getElementById('closeBtn').onclick = ()=>closeVoting();
}

function closeVoting(){
  roomRef.once('value').then(snap=>{
    const room = snap.val();
    if(!room || room.status!=='voting') return;
    const plans = room.plans || {};
    const votes = room.votes || {};
    const survivors = Object.entries(plans).filter(([id,p])=>!p.vetoedBy).map(([id])=>id);
    const tally = {};
    survivors.forEach(id=>tally[id]=0);
    Object.values(votes).forEach(pid=>{ if(tally[pid]!==undefined) tally[pid]++; });
    let winnerId = null;
    if(survivors.length === 0){
      winnerId = null;
    } else {
      let max = -1;
      survivors.forEach(id=>{ if(tally[id]>max) max = tally[id]; });
      const top = survivors.filter(id=>tally[id]===max);
      winnerId = top[Math.floor(Math.random()*top.length)];
    }
    roomRef.update({status:'ended', winner: winnerId});
  });
}

/* ---------- Ended ---------- */
function renderEnded(room){
  const isHost = room.players[playerId] && room.players[playerId].isHost;
  const plans = room.plans || {};
  const votes = room.votes || {};
  const winnerId = room.winner;
  const winner = winnerId ? plans[winnerId] : null;

  const survivors = Object.entries(plans).filter(([id,p])=>!p.vetoedBy);
  const tally = {};
  survivors.forEach(([id])=>tally[id]=0);
  Object.values(votes).forEach(pid=>{ if(tally[pid]!==undefined) tally[pid]++; });
  const ranked = survivors
    .filter(([id])=>id !== winnerId)
    .sort((a,b)=>tally[b[0]]-tally[a[0]]);

  app.innerHTML='';
  app.appendChild(el(`
    <div class="wrap">
      <div class="stack">
        <div class="winner-card">
          <p class="pill" style="background:rgba(255,194,75,0.2);color:var(--gold);border-color:rgba(255,194,75,0.4);">Plan de hoy</p>
          <div style="font-size:56px;line-height:1;margin-top:10px;">${winner ? (winner.emoji||'') : ''}</div>
          <div class="winner-name">${winner ? escapeHtml(winner.name) : 'Sin ganador'}</div>
          ${winner ? `<p class="lead" style="margin-top:14px;">${tally[winnerId]} voto${tally[winnerId]===1?'':'s'}</p>` : ''}
        </div>

        ${ranked.length ? `
          <div class="card stack">
            <h3 style="font-size:16px;color:var(--muted);">También sonaron</h3>
            ${ranked.map(([id,p])=>`
              <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);">
                <span>${p.emoji||''} ${escapeHtml(p.name)}</span>
                <span style="color:var(--muted);font-family:'Space Grotesk',monospace;">${tally[id]} voto${tally[id]===1?'':'s'}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${isHost
          ? `<button class="block" id="newBtn">Nueva quedada</button>
             <button class="ghost" id="closeBtn">Cerrar sala</button>`
          : `<button class="block secondary" id="leaveBtn">Salir</button>`}
      </div>
    </div>
  `));

  if(isHost){
    document.getElementById('newBtn').onclick = ()=>{ roomRef.remove(); renderHostSetup(); };
    document.getElementById('closeBtn').onclick = ()=>{ roomRef.remove(); renderHome(); };
  } else {
    document.getElementById('leaveBtn').onclick = ()=>renderHome();
  }
}

/* ---------- Start ---------- */
boot();
</script>
</body>
</html>
